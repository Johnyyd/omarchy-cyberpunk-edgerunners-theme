# Cyberpunk Edgerunners - Source of Truth Palette
# All derived configs are generated from this file via build.sh

mode = "dark"

# Core palette (ANSI 0-15 + semantic aliases)
# Night Void base
color0 = "#26173E"        # background / black
color8 = "#3D99CA"        # bright_black / muted / steel blue

# Cyberpunk Neon Crimson (Red)
color1 = "#FF003C"        # red / error / critical
color9 = "#FF003C"        # bright_red

# Vivid Electric Cyan (Green in ANSI, but cyan visually)
color2 = "#1BD7F8"        # green / success / strings
color10 = "#1BD7F8"       # bright_green

# Acid Lime Yellow (Yellow)
color3 = "#EAE43E"        # yellow / warnings / numbers
color11 = "#FFFF4C"       # bright_yellow / cyberpunk yellow (primary accent)

# Electric Indigo (Blue)
color4 = "#5A4ED6"        # blue / constants / links
color12 = "#5A4ED6"       # bright_blue

# Vivid Neon Fuchsia (Magenta)
color5 = "#DA11C9"        # magenta / keywords / operators
color13 = "#B03DCE"       # bright_magenta / neon orchid (types)

# Cyber Sky Blue (Cyan)
color6 = "#02B3F1"        # cyan / variables / secondary
color14 = "#1BD7F8"       # bright_cyan / vivid electric cyan

# Luminous Aqua (White/Foreground)
color7 = "#46FEEC"        # white / foreground / primary text
color15 = "#46FEEC"       # bright_white / bright_foreground

# Semantic aliases (used by templates)
background = "#26173E"
foreground = "#46FEEC"
accent = "#DA11C9"
cursor = "#FFFF4C"
selection_background = "#ED4BA8"
selection_foreground = "#FFFF4C"
lighter_bg = "#28187D"
muted = "#3D99CA"
dark_fg = "#3D99CA"
red = "#FF003C"
green = "#1BD7F8"
yellow = "#EAE43E"
blue = "#5A4ED6"
magenta = "#DA11C9"
cyan = "#02B3F1"
orange = "#FFFF4C"
brown = "#94007A"
bright_red = "#FF003C"
bright_green = "#1BD7F8"
bright_yellow = "#FFFF4C"
bright_blue = "#5A4ED6"
bright_magenta = "#B03DCE"
bright_cyan = "#1BD7F8"

# Neovim/Lua extras (kept for compatibility with neovim.lua palette)
dark_bg = "#26173E"
darker_bg = "#26173E"
light_fg = "#46FEEC"
bright_fg = "#46FEEC"